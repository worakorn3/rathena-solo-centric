version: "3.7"

services:
    db:
        image: "mariadb:noble"
        container_name: "rathena-db"
        restart: unless-stopped
        ports:
            - "3306:3306" # allow DB connections from host
        volumes:
            - "rathenadb:/var/lib/mysql" # save database to local disk
            - "../../sql-files/:/docker-entrypoint-initdb.d" # initialize db with ./sql-files
            - "./asset/primary.cnf:/etc/mysql/conf.d/primary.cnf:ro"
            - "./asset/init-primary-replication.sql:/docker-entrypoint-initdb.d/99-replication-users.sql:ro"
        environment:
            MYSQL_ROOT_PASSWORD: ragnarok
            MYSQL_DATABASE: ragnarok
            MYSQL_USER: ragnarok
            MYSQL_PASSWORD: ragnarok

    db-replica:
        image: "mariadb:noble"
        container_name: "rathena-db-replica"
        restart: unless-stopped
        ports:
            - "3307:3306" # allow read-only DB connections from host
        volumes:
            - "rathenadb_replica:/var/lib/mysql"
            - "./asset/replica.cnf:/etc/mysql/conf.d/replica.cnf:ro"
            - "./asset/replica-entrypoint.sh:/docker-entrypoint-init.sh:ro"
        entrypoint: ["/bin/bash", "/docker-entrypoint-init.sh"]
        environment:
            MYSQL_ROOT_PASSWORD: ragnarok
        depends_on:
            - db
        healthcheck:
            test: ["CMD-SHELL", "mariadb -uroot -pragnarok -e 'SHOW SLAVE STATUS\\G' | grep -q 'Slave_IO_Running: Yes' || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s

    builder:
        image: "rathena:local"
        container_name: "rathena-builder"
        command: "/rathena/tools/docker/builder.sh"
        volumes:
            - "../..:/rathena" # mount git repo directory inside container
            - "./asset/inter_conf.txt:/rathena/conf/import/inter_conf.txt" # load db connection
            - "./asset/char_conf.txt:/rathena/conf/import/char_conf.txt" #localdev login-char relation
            - "./asset/map_conf.txt:/rathena/conf/import/map_conf.txt" #localdev char-map relation
        init: true # helps with signal forwarding and process reaping
        tty: true
        stdin_open: true
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            BUILDER_CONFIGURE: "--enable-packetver=20250716"

    login:
        image: "rathena:local"
        container_name: "rathena-login"
        restart: unless-stopped
        command: sh -c "/bin/wait-for db:3306 -- /rathena/login-server"
        ports:
            - "6900:6900" # login server
        volumes:
            - "../..:/rathena" # mount git repo directory inside container
            - "./asset/inter_conf.txt:/rathena/conf/import/inter_conf.txt" # load db connection
            - "./asset/char_conf.txt:/rathena/conf/import/char_conf.txt" #localdev login-char relation
            - "./asset/map_conf.txt:/rathena/conf/import/map_conf.txt" #localdev char-map relation
        init: true # helps with signal forwarding and process reaping
        tty: true
        stdin_open: true
        build:
            context: .
            dockerfile: Dockerfile
        depends_on:
            - db
    char:
        image: "rathena:local"
        container_name: "rathena-char"
        restart: unless-stopped
        command: sh -c "/bin/wait-for db:3306 -- /rathena/char-server"
        ports:
            - "6121:6121" # char server
        volumes:
            - "../..:/rathena" # mount git repo directory inside container
            - "./asset/inter_conf.txt:/rathena/conf/import/inter_conf.txt" # load db connection
            - "./asset/char_conf.txt:/rathena/conf/import/char_conf.txt" #localdev login-char relation
            - "./asset/map_conf.txt:/rathena/conf/import/map_conf.txt" #localdev char-map relation
        init: true # helps with signal forwarding and process reaping
        tty: true
        stdin_open: true
        build:
            context: .
            dockerfile: Dockerfile
        depends_on:
            - login
    map:
        image: "rathena:local"
        container_name: "rathena-map"
        restart: unless-stopped
        command: sh -c "/bin/wait-for db:3306 -- /rathena/map-server"
        ports:
            - "5121:5121" # map server
        volumes:
            - "../..:/rathena" # mount git repo directory inside container
            - "./asset/inter_conf.txt:/rathena/conf/import/inter_conf.txt" # load db connection
            - "./asset/char_conf.txt:/rathena/conf/import/char_conf.txt" #localdev login-char relation
            - "./asset/map_conf.txt:/rathena/conf/import/map_conf.txt" #localdev char-map relation
        init: true # helps with signal forwarding and process reaping
        tty: true
        stdin_open: true
        build:
            context: .
            dockerfile: Dockerfile
        depends_on:
            - char

    web-portal:
        image: "rathena-web-portal:local"
        container_name: "rathena-web-portal"
        restart: unless-stopped
        build:
            context: ../../web
            dockerfile: Dockerfile
        ports:
            - "3001:3000"
        environment:
            DB_HOST: "db-replica"
            DB_PORT: 3306
            DB_USER: "ro_user"
            DB_PASSWORD: "ro_password"
            DB_DATABASE: "ragnarok"
            PORT: 3000
        depends_on:
            - db-replica

volumes:
    rathenadb:
    rathenadb_replica:
